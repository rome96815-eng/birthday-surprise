

   
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Surprise 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body {
      margin: 0; padding: 0;
      background: linear-gradient(-45deg, #ff4e50, #f9d423, #ff007f, #7f00ff);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 90%; max-width: 380px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-radius: 28px; padding: 25px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25), 0 0 20px rgba(255, 105, 180, 0.5);
      text-align: center; position: relative;
      border: 3px solid rgba(255, 255, 255, 0.7);
    }

    .card { display: flex; flex-direction: column; align-items: center; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .hidden { display: none !important; }

    .avatar-box {
      width: 90px; height: 90px; border-radius: 50%;
      border: 4px dashed #ff007f; display: flex;
      justify-content: center; align-items: center;
      font-size: 40px; margin-bottom: 12px; background: #fff0f5;
      box-shadow: 0 8px 15px rgba(255, 0, 127, 0.2);
    }

    h2 {
      background: linear-gradient(45deg, #ff007f, #7f00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 10px 0 5px 0; font-size: 21px; font-weight: 700;
    }

    p { color: #555; font-size: 13px; margin-bottom: 15px; }

    input {
      width: 100%; padding: 12px; border: 2.5px solid #ff007f;
      border-radius: 15px; text-align: center; font-size: 15px;
      margin-bottom: 10px; outline: none; background: #fff;
    }

    .hint-text { font-size: 12px; color: #7f00ff; font-weight: 600; margin-bottom: 12px; display: none; }

    .btn {
      background: linear-gradient(45deg, #ff007f, #ff4e50);
      color: white; border: none; padding: 12px 20px;
      border-radius: 30px; font-size: 14px; font-weight: 700;
      cursor: pointer; width: 100%;
      box-shadow: 0 5px 15px rgba(255, 0, 127, 0.35);
      margin-top: 6px; transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.96); }

    .big-num {
      font-size: 70px;
      background: linear-gradient(45deg, #ff007f, #f9d423);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700; margin: 10px 0;
    }
    
    .flip-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 12px; }
    .flip-card {
      background: linear-gradient(135deg, #ffe6eb, #f3e5f5);
      border: 2px solid #ff7eb3; border-radius: 14px; padding: 12px;
      color: #d63384; font-weight: 600; font-size: 12.5px; cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }

    /* 2 Photos Gallery Layout */
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; margin-bottom: 15px; }
    .img-card {
      width: 100%; height: 130px; border-radius: 14px;
      object-fit: cover; border: 3px solid #ff007f;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .quiz-box { background: #fff0f5; border: 2px solid #ff7eb3; border-radius: 15px; padding: 12px; width: 100%; margin-bottom: 12px; text-align: left; }
    .quiz-q { font-size: 13px; font-weight: 700; color: #d63384; margin-bottom: 8px; }
    .quiz-opts { display: flex; gap: 8px; }
    .opt-btn { flex: 1; background: #fff; border: 1.5px solid #ff007f; color: #ff007f; padding: 6px; border-radius: 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
    .opt-btn:active { background: #ff007f; color: #fff; }

    .scratch-container {
      position: relative; width: 260px; height: 130px;
      margin: 10px 0; border-radius: 15px; overflow: hidden;
      border: 3px solid #ff007f;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .scratch-secret {
      position: absolute; width: 100%; height: 100%;
      background: linear-gradient(135deg, #ffe6eb, #fff);
      display: flex; align-items: center; justify-content: center;
      color: #d63384; font-weight: bold; padding: 10px; font-size: 12.5px; text-align: center;
    }
    canvas { position: absolute; top: 0; left: 0; cursor: pointer; }
    
    .cake-box { font-size: 55px; margin: 10px 0; cursor: pointer; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15)); }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Audio Source -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div class="container">

    <!-- Screen 0: Password Lock -->
    <div id="screen-lock" class="card">
      <div class="avatar-box">🔒</div>
      <h2>Surprise Unlocking 💖</h2>
      <p>Enter the passcode to open your surprise!</p>
      <input type="password" id="passInput" placeholder="Enter password...">
      <p id="hintBox" class="hint-text">💡 Hint: Special Date and Time</p>
      <button class="btn" onclick="checkPass()">Unlock Surprise ✨</button>
      <p id="errorMsg" style="color:#ff2e63; display:none; margin-top:8px; font-size:12px; font-weight:bold;">Wrong Code!</p>
      <button class="btn" style="background:transparent; color:#888; box-shadow:none; font-size:11px;" onclick="showHint()">Need a hint?</button>
    </div>

    <!-- Screen 1: Tap Gift Box -->
    <div id="screen-1" class="card hidden">
      <div class="avatar-box" style="cursor:pointer;" onclick="triggerConfetti(); nextScreen(2);">🎁</div>
      <h2>Tap the Gift Box!</h2>
